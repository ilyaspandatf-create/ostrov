<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Остров подписчиков — найди свой дом</title>
  <meta name="description" content="Воксельный остров, который строят подписчики @ostrov.podpischikov. Найди свой дом по нику." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="island.js"></script>
  <style>
    :root {
      --ink: #0b3954;
      --teal: #2ec4b6;
      --teal-dark: #13897f;
      --sand: #f4d35e;
      --card: #ffffff;
      --sky: #8fd6f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--sky); font-family: "Montserrat", system-ui, sans-serif; color: var(--ink); }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .tag {
      position: absolute; left: 0; top: 0; padding: 4px 10px 5px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.92); font-size: 12px; font-weight: 800; white-space: nowrap;
      box-shadow: 0 3px 0 rgba(11, 57, 84, 0.2); transform-origin: 50% 100%; will-change: transform;
    }
    .tag.me { background: var(--sand); font-size: 15px; padding: 6px 14px 7px; z-index: 2; }

    header {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px));
      display: flex; flex-direction: column; gap: 10px; z-index: 5;
    }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--ink); color: #fff; border-radius: 18px; padding: 10px 16px; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
    .bar h1 { font-size: 16px; font-weight: 900; letter-spacing: .3px; }
    .bar .count { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .bar .count b { color: var(--sand); }
    .search { position: relative; }
    .search input {
      width: 100%; border: 0; border-radius: 16px; padding: 14px 16px 14px 44px; font: 800 16px "Montserrat", sans-serif; color: var(--ink);
      background: var(--card); box-shadow: 0 6px 0 rgba(11,57,84,.18); outline: none;
    }
    .search::before { content: "🔍"; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 17px; }
    .suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card); border-radius: 14px;
      box-shadow: 0 8px 24px rgba(11,57,84,.2); overflow: hidden; display: none; }
    .suggest button { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; padding: 11px 16px;
      font: 700 15px "Montserrat", sans-serif; color: var(--ink); text-align: left; cursor: pointer; }
    .suggest button:hover, .suggest button:focus { background: #eaf8f6; outline: none; }
    .suggest small { opacity: .6; font-weight: 600; }

    #card {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, calc(100% - 24px));
      background: var(--card); border-radius: 22px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(11,57,84,.25); z-index: 5; display: none;
    }
    #card .who { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #card .no { font-size: 13px; font-weight: 800; opacity: .65; }
    #card .nick { font-size: 22px; font-weight: 900; word-break: break-all; }
    #card .lvl { font-size: 15px; font-weight: 800; background: #eaf8f6; color: var(--teal-dark); border-radius: 12px; padding: 6px 10px; white-space: nowrap; }
    #card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { flex: 1 1 160px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px;
      padding: 12px 14px; font: 800 15px "Montserrat", sans-serif; cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--teal-dark); color: #fff; }
    .btn.ghost { background: #eef2f5; color: var(--ink); }
    #card .close { position: absolute; top: 8px; right: 12px; border: 0; background: none; font-size: 22px; color: var(--ink); opacity: .5; cursor: pointer; }
    #card p { margin-top: 8px; font-size: 14px; font-weight: 600; line-height: 1.4; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 18px; z-index: 9; background: var(--sky); }
    .hint { position: fixed; right: 12px; bottom: 12px; font-size: 12px; font-weight: 700; color: rgba(11,57,84,.7); z-index: 4; }
    @media (max-width: 480px) { .bar h1 { font-size: 14px; } .bar .count { font-size: 13px; } .hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="loading">🏝 Загружаем остров…</div>

  <header>
    <div class="bar">
      <h1>🏝 Остров подписчиков</h1>
      <div class="count">Жителей: <b id="count">…</b></div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Найди свой дом: твой ник" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div class="suggest" id="suggest"></div>
    </div>
  </header>

  <div id="card" role="dialog" aria-live="polite">
    <button class="close" id="close" aria-label="Закрыть">×</button>
    <div id="cardBody"></div>
  </div>
  <div class="hint">Крути и приближай остров пальцами или мышкой</div>

  <script>
    const IG = "ostrov.podpischikov";
    const BOT = "https://t.me/ostrov_podpischikov_bot";
    const $ = (id) => document.getElementById(id);

    // ── renderer and scene
    const canvas = $("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#8fd6f6");
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
    scene.add(new THREE.HemisphereLight("#d8f3ff", "#5a8f3c", 0.5));
    const sun = new THREE.DirectionalLight("#fff1d6", 0.72);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0006;
    scene.add(sun, sun.target);
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: "#1E9CC8" }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.receiveShadow = true;
    scene.add(ocean);

    const controls = new THREE.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.minDistance = 8;

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w < h ? 60 : 45;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    // ── data and island
    let island, residents = [], byNick = new Map();
    const norm = (s) => (s || "").trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/^@/, "").split(/[/?]/)[0].toLowerCase();

    fetch("data/residents.json?v=" + Math.floor(Date.now() / 60000))
      .then((r) => r.json())
      .then((data) => {
        residents = data.residents || data;
        island = OstrovIsland.build(THREE, residents);
        scene.add(island.group);
        residents.forEach((r) => byNick.set(r.nick, r));
        $("count").textContent = (residents.length + 1).toLocaleString("ru-RU");
        const R = island.radius;
        Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: R * 4 });
        sun.shadow.camera.updateProjectionMatrix();
        sun.position.set(-R * 0.9, R * 1.6, R * 0.8);
        controls.maxDistance = R * 4;
        scene.fog = new THREE.Fog("#a8e0f8", R * 3, R * 7);
        flyTo(new THREE.Vector3(0, 2, 0), new THREE.Vector3(R * 0.9, R * 0.95 + 10, R * 1.25), 0);
        $("loading").remove();
        const fromHash = norm(decodeURIComponent(location.hash.slice(1)));
        if (fromHash) find(fromHash);
      })
      .catch(() => { $("loading").textContent = "Не удалось загрузить остров 😕 Обнови страницу"; });

    // ── camera flights
    let flight = null;
    function flyTo(target, pos, dur = 1.6) {
      if (!dur) { controls.target.copy(target); camera.position.copy(pos); controls.update(); return; }
      flight = { t0: performance.now(), dur: dur * 1000, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: target, toP: pos };
    }
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

    // ── labels: the nearest houses to the view centre, plus the selected one
    const labelsEl = $("labels");
    const pool = [];
    let selected = null;
    function tag(i) {
      if (!pool[i]) { const el = document.createElement("div"); el.className = "tag"; labelsEl.appendChild(el); pool[i] = el; }
      return pool[i];
    }
    const v = new THREE.Vector3();
    function drawLabels() {
      if (!island) return;
      const maxTags = window.innerWidth < 600 ? 18 : 40;
      const list = [];
      island.houses.forEach((h) => { if (h.nick !== selected) list.push([h.top.distanceToSquared(camera.position), h]); });
      list.sort((a, b) => a[0] - b[0]);
      const show = list.slice(0, maxTags).map((x) => x[1]);
      if (selected && island.houses.has(selected)) show.unshift(island.houses.get(selected));
      const w = window.innerWidth, hgt = window.innerHeight;
      const placed = []; // screen boxes already taken, so tags never pile up
      let used = 0;
      show.forEach((h) => {
        v.copy(h.top).project(camera);
        if (v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1) return;
        const me = h.nick === selected;
        const dist = Math.sqrt(h.top.distanceToSquared(camera.position));
        if (!me && dist > 140) return;
        const s = me ? 1 : Math.max(0.6, Math.min(1.1, 40 / dist));
        const x = (v.x * 0.5 + 0.5) * w, y = (-v.y * 0.5 + 0.5) * hgt;
        const bw = (h.nick.length + 1) * (me ? 10 : 7.6) * s + 20, bh = (me ? 30 : 23) * s;
        const box = [x - bw / 2, y - bh, x + bw / 2, y];
        if (placed.some((p) => box[0] < p[2] && box[2] > p[0] && box[1] < p[3] && box[3] > p[1])) return;
        placed.push(box);
        const el = tag(used++);
        if (el.textContent !== "@" + h.nick) el.textContent = "@" + h.nick;
        el.classList.toggle("me", me);
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%) scale(${s.toFixed(2)})`;
        el.style.display = "";
      });
      for (let i = used; i < pool.length; i++) pool[i].style.display = "none";
    }

    // ── marker over the found house
    const marker = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.4, 4), new THREE.MeshLambertMaterial({ color: "#f4d35e", emissive: "#5a4500" }));
    marker.rotation.x = Math.PI;
    marker.visible = false;
    scene.add(marker);

    function loop(now) {
      requestAnimationFrame(loop);
      if (flight) {
        const k = Math.min(1, (now - flight.t0) / flight.dur), e = ease(k);
        controls.target.lerpVectors(flight.fromT, flight.toT, e);
        camera.position.lerpVectors(flight.fromP, flight.toP, e);
        if (k >= 1) flight = null;
      }
      controls.update();
      if (marker.visible) { marker.position.y = marker.userData.y + Math.sin(now / 250) * 0.4; marker.rotation.y = now / 600; }
      renderer.render(scene, camera);
      drawLabels();
    }
    requestAnimationFrame(loop);

    // ── search
    const q = $("q"), sug = $("suggest");
    q.addEventListener("input", () => {
      const s = norm(q.value);
      if (!s) { sug.style.display = "none"; return; }
      const hits = residents.filter((r) => r.nick.includes(s)).sort((a, b) => (a.nick.startsWith(s) ? 0 : 1) - (b.nick.startsWith(s) ? 0 : 1) || a.no - b.no).slice(0, 6);
      sug.innerHTML = "";
      hits.forEach((r) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = `<span>@${r.nick}</span><small>№${r.no}</small>`;
        btn.onclick = () => find(r.nick);
        sug.appendChild(btn);
      });
      sug.style.display = hits.length ? "block" : "none";
    });
    q.addEventListener("keydown", (e) => { if (e.key === "Enter") find(norm(q.value)); });
    document.addEventListener("click", (e) => { if (!e.target.closest(".search")) sug.style.display = "none"; });

    function find(nick) {
      sug.style.display = "none";
      q.blur();
      const h = island && island.houses.get(nick);
      const card = $("card"), body = $("cardBody");
      card.style.display = "block";
      if (!h) {
        selected = null;
        marker.visible = false;
        body.innerHTML = `<div class="nick">@${escapeHtml(nick || "…")}</div>
          <p>Тебя пока нет на острове. Подпишись на @${IG} и напиши любой коммент под последним рилсом — дом появится в течение 15 минут 🏠</p>
          <div class="actions"><a class="btn primary" href="https://www.instagram.com/${IG}/" target="_blank" rel="noopener">Открыть Instagram</a></div>`;
        return;
      }
      selected = nick;
      history.replaceState(null, "", "#" + nick);
      marker.visible = true;
      marker.userData.y = h.top.y + 2.2;
      marker.position.set(h.top.x, marker.userData.y, h.top.z);
      const lv = OstrovIsland.LEVELS[h.level - 1];
      flyTo(h.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), h.pos.clone().add(new THREE.Vector3(5, 13, 9)));
      body.innerHTML = `<div class="who"><div><div class="no">Житель №${h.no}</div><div class="nick">@${escapeHtml(h.nick)}</div></div>
          <div class="lvl">${lv.emoji} ${lv.name}</div></div>
        <div class="actions">
          <button class="btn primary" id="passport">🪪 Паспорт для сторис</button>
          <a class="btn ghost" href="${BOT}" target="_blank" rel="noopener">⬆️ Прокачать дом</a>
        </div>`;
      $("passport").onclick = () => passport(h);
    }
    window.addEventListener("hashchange", () => {
      const n = norm(decodeURIComponent(location.hash.slice(1)));
      if (n && n !== selected && island) find(n);
    });
    $("close").onclick = () => { $("card").style.display = "none"; selected = null; marker.visible = false; history.replaceState(null, "", location.pathname); };
    function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    // ── passport: a 1080×1920 story image of the house
    function passport(h) {
      const W = 1080, H = 1920;
      const r2 = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      r2.setSize(W, 1300, false);
      r2.shadowMap.enabled = true;
      const cam = new THREE.PerspectiveCamera(40, W / 1300, 0.1, 2000);
      cam.position.copy(h.pos).add(new THREE.Vector3(8, 7, 10));
      cam.lookAt(h.pos.clone().add(new THREE.Vector3(0, 1.6, 0)));
      // the yellow marker stays on, so the story shows which house is yours
      marker.visible = true;
      marker.position.set(h.top.x, h.top.y + 2.2, h.top.z);
      r2.render(scene, cam);

      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "#7fd0f5"); grad.addColorStop(1, "#cdeffc");
      g.fillStyle = grad; g.fillRect(0, 0, W, H);
      g.drawImage(r2.domElement, 0, 300, W, 1300);
      r2.dispose();
      g.textAlign = "center";
      roundRect(g, 140, 120, 800, 120, 36, "#0b3954");
      g.fillStyle = "#fff"; g.font = "900 58px Montserrat"; g.fillText("ПАСПОРТ ЖИТЕЛЯ", W / 2, 202);
      roundRect(g, 90, 1480, 900, 330, 44, "#ffffff");
      g.fillStyle = "#0b3954"; g.font = "800 44px Montserrat"; g.fillText("Житель №" + h.no + " · " + OstrovIsland.LEVELS[h.level - 1].name, W / 2, 1568);
      let size = 84;
      g.font = `900 ${size}px Montserrat`;
      while (g.measureText("@" + h.nick).width > 820 && size > 40) { size -= 4; g.font = `900 ${size}px Montserrat`; }
      g.fillText("@" + h.nick, W / 2, 1680);
      g.fillStyle = "#13897f"; g.font = "800 38px Montserrat"; g.fillText("🏝 @" + IG, W / 2, 1765);
      c.toBlob((blob) => {
        const file = new File([blob], `ostrov-${h.nick}.png`, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "Мой дом на Острове подписчиков" }).catch(() => {});
        } else {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = file.name;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        }
      }, "image/png");
    }
    function roundRect(g, x, y, w, h, r, fill) {
      g.beginPath();
      g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
      g.closePath(); g.fillStyle = fill; g.fill();
    }
  </script>
</body>
</html>
